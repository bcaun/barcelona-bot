# Тексты бота (русский). Формат HTML Telegram: <b>, <i>, <a href="...">.
start:
  welcome: |-
    Здравствуйте, {name}! 👋

    Я бот агентства <b>barcelona.ru</b> — недвижимость в Барселоне для русскоязычных покупателей и инвесторов.

    Чем помочь?

