pay:
  offer: |-
    📄 <b>Nota simple — {price} €</b>
    Выписка из Реестра собственности по объекту <b>{address}</b>: кто собственник, есть ли ипотека, аресты и другие обременения.

    Закажем её в реестре и пришлём сюда, в Telegram, в течение рабочего дня (обычно быстрее). Квитанцию об оплате пришлёт Stripe на ваш e-mail.

    Оплачивая, вы соглашаетесь с обработкой данных для выполнения заказа — <a href="{privacy_url}">политика конфиденциальности</a>.
  title: "Nota simple"
  description: "Выписка из Реестра собственности: {address} (RC {rc})"
  outdated: "Цена изменилась или счёт устарел. Нажмите «Nota simple» ещё раз."
  thanks: "✅ Оплата получена — {amount}. Номер заказа: #{lead_id}.\nЗакажем nota simple по объекту {rc} и пришлём сюда в течение рабочего дня."
