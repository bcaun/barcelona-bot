lang:
  choose: "Выберите язык / Choose language:"
  changed: "Язык переключён на русский."

contact:
  consent_text: |-
    Чтобы менеджер связался с вами, нам нужно ваше согласие на обработку персональных данных (имя, username в Telegram и, по желанию, телефон).

    Подробнее — в <a href="{privacy_url}">политике конфиденциальности</a>. Удалить свои данные можно в любой момент командой /delete_me.
  consent_button: "✅ Согласен на обработку данных"
  ask_phone: |-
    Спасибо! Как с вами удобнее связаться?

    Нажмите «📱 Отправить телефон» — Telegram передаст номер, привязанный к аккаунту. Или выберите «Только Telegram» — тогда напишем вам в личные сообщения.
  send_phone_button: "📱 Отправить телефон"
  username_only_button: "💬 Только Telegram, без телефона"
  need_username: "У вашего аккаунта нет username, поэтому написать вам первыми мы не сможем. Пожалуйста, отправьте телефон кнопкой ниже."
  not_your_contact: "Пожалуйста, отправьте свой номер кнопкой «📱 Отправить телефон»."
  use_buttons: "Пожалуйста, воспользуйтесь кнопками ниже или нажмите «✖️ Отмена»."
  thanks: "Заявка принята ✅ Менеджер свяжется с вами в ближайшее время."

delete:
  confirm_text: "Удалить все ваши данные (профиль, историю действий и заявки)? Это действие необратимо."
  confirm_button: "🗑 Да, удалить"
  done: "Ваши данные удалены. Если захотите вернуться — просто нажмите /start."

help:
  text: |-
    /start — главное меню
    /language — сменить язык
    /delete_me — удалить мои данные

commands:
  start: "Главное меню"
  language: "Сменить язык"
  delete_me: "Удалить мои данные"

