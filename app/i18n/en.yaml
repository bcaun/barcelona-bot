  csv_empty: "No requests yet."

calc:
  intro: "🧮 <b>Purchase and ownership cost calculator</b>\nAnswer a few questions and I'll estimate taxes and costs."
  back: "⬅️ Back"
  answer_yes: "Yes"
  answer_no: "No"
  dont_know: "I don't know"
  q:
    type: "What kind of property?"
    price: "Purchase price, €?\n\nType a number, e.g. <code>450000</code>, <code>450 000</code> or <code>450k</code>."
    ref: "Cadastral reference value (<i>valor de referencia</i>), €?\n\nYou can find it in the Sede Electrónica del Catastro. If you don't know it, tap “I don't know”."
    buyer: "Who is buying?"
    habitual: "Is it your main residence (<i>vivienda habitual</i>)?"
    family: "Is your family a large family or a single-parent family?"
    children: "How many children are in the family?"
    age: "Is the buyer {age} years old or younger?"
    disability: "Does the buyer have a disability of {pct}% or more?"
    income: "Is your annual income for this relief (IRPF base minus personal and family allowance) no more than <b>{limit}</b>?"
    large_holder: "Does the buyer own more than {dwellings} dwellings in Spain or more than {m2} m² of residential space (or is it a large-holder company)?"
    mortgage: "Are you buying with a mortgage?"
    mortgage_share: "What share of the price will the loan cover? Usually {default}%.\n\nChoose or type a number from 1 to 100."
    status: "Your tax status after the purchase?"
    cadastral: "Cadastral value (<i>valor catastral</i>) from the IBI bill, €?\n\nNeeded for IBI and non-resident tax. If you don't know it, tap “I don't know”."
    rent: "Do you plan to rent it out long-term?"
    rent_amount: "Expected monthly rent, €?"
  a:
    resale: "Resale"
    new: "New build (from developer)"
    private: "Individual"
    company: "Company"
    family_none: "No"
    family_large: "Large family"
    family_single: "Single-parent"
    resident: "Spanish tax resident"
    eu_eea: "Non-resident, EU/EEA"
    non_eu: "Non-resident, outside EU"
  err:
    amount: "I couldn't read the amount. Type a number, e.g. <code>450000</code>, <code>450 000</code> or <code>450k</code>."
    price_range: "The price must be between {min} and {max}. Please check the number."
    percent: "Type a number from 1 to 100, e.g. <code>60</code>."
    use_buttons: "Please choose an option using the buttons above."
    expired: "This calculation has expired. Tap “🧮 Purchase cost calculator” in the menu to start again."
  r:
    title: "🧮 <b>Estimate: {type}, {price}</b>"
    block_a: "<b>A. One-off purchase costs</b>"
    itp_general: "Purchase tax (ITP, general scale) on a base of {base}: <b>{total}</b>"
    itp_line: "  • {lower}–{upper} × {rate} = {amount}"
    itp_line_top: "  • above {lower} × {rate} = {amount}"
    itp_reduced: "Purchase tax (ITP, reduced rate {rate} — main residence): {base} × {rate} = <b>{total}</b>"
    itp_large_holder: "Purchase tax (ITP, large-holder rate {rate}): {base} × {rate} = <b>{total}</b>"
    new_build: "New-build purchase tax: <b>{total}</b>\n  • IVA: {price} × {iva_rate} = {iva}\n  • AJD: {ajd_base} × {ajd_rate} = {ajd}"
    base_from_reference: "ℹ️ The tax base is the valor de referencia ({ref}) because it is higher than the price."
    reference_unknown: "⚠️ No valor de referencia given, so tax is calculated on the price. Tax is charged on the higher of the two — if the reference value is higher, the tax will be higher."
    reference_unknown_new: "⚠️ No valor de referencia given, so AJD is calculated on the price. AJD is charged on the higher of the two."
    note_large_holder_exclusions_not_modelled: "⚠️ Exemptions and reliefs for large holders are not modelled — please ask us."
    notary: "Notary: {v}"
    registry: "Land registry: {v}"
    gestoria: "Gestoría: {v}"
    tasacion: "Mortgage valuation (tasación): {v}"
    agency: "Agency fee: {v}"
    extra: "<b>Total on top of the price: {v}</b>"
    total: "<b>Total including the price: {v}</b>"
    own_funds: "Own funds needed (loan {share} = {loan}): <b>{v}</b>"
    block_b: "<b>B. Annual ownership costs</b>"
    ibi: "IBI (property tax): ≈ {v} per year"
    ibi_unknown: "IBI (property tax): depends on the cadastral value, usually ≈ {min}–{max} of it per year"
    comunidad: "Comunidad (owners' community fees): as per the property"
    irnr: "Non-resident tax on imputed income (IRNR): {vc} × {coef} × {rate} = <b>{v} per year</b>"
    irnr_formula: "Non-resident tax on imputed income (IRNR): cadastral value × {coef} × {rate} per year. Enter the valor catastral to get the amount."
    block_c: "<b>C. Long-term rental</b>"
    rent_income: "Rent: {month} × 12 = {year} per year"
    gross_yield: "Gross yield: <b>{v}</b> (on price + average purchase costs)"
    rent_tax_eu: "Rental income tax (EU/EEA non-resident, {rate} on income minus IBI): ≈ {v} per year"
    rent_tax_non_eu: "Rental income tax (non-EU non-resident, {rate} on gross income): ≈ {v} per year"
    rent_tax_resident: "For residents, rental income is taxed under the IRPF scale with deductions — we'll calculate it in a consultation."
    rent_tax_no_ibi: "Without the valor catastral, IBI is not deducted from income."
    net_yield: "Net yield (simplified, excluding comunidad and repairs): <b>{v}</b>"
    net_yield_resident: "Yield after IBI, before tax (simplified): <b>{v}</b>"
    rent_index_link: "Rent price index: {url}"
    locked: "🔒 The “Annual costs” and “Rental” sections are available to subscribers of our channel."
    disclaimer: "<i>This is an estimate and not tax advice. The exact amount will be confirmed by the notary / gestor.</i>"
    verified: "<i>Rates as of {date}</i>"
  btn:
    lead: "📩 Find properties for this budget"
    restart: "🔁 Recalculate"
    subscribe: "📢 Subscribe"
    subscribed: "✅ I've subscribed"
