# bot — Telegram-бот (всегда).
# api + cloudflared — мини-апп квиза (профиль webapp: в .env COMPOSE_PROFILES=webapp).
# Порты на сервере не открываются: cloudflared сам подключается к Cloudflare (Cloudflare Tunnel),
# поэтому не мешает другим сайтам на портах 80/443.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/data                 # база SQLite (общая с api)
      - ./config:/srv/config:ro        # настройки и вопросы: правка + restart, без пересборки
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build: .
    profiles: [webapp]
    restart: unless-stopped
    env_file: .env
    depends_on: [bot]                  # bot применяет миграции базы при старте
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - bot_data:/data
      - ./config:/srv/config:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [webapp]
    restart: unless-stopped
    depends_on: [api]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  bot_data:
