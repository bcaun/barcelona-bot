# Не секретные настройки. Секреты (токен, ID чатов) — только в .env.
# После правки этого файла перезапустите бота: docker compose restart bot

timezone: "Europe/Madrid"   # для /stats («за сегодня» считается по этому часовому поясу)

channel:
  url: "https://t.me/barcelona_ru"   # ЗАПОЛНИТЬ: публичная ссылка на канал (кнопка «Наш канал»)
  subscription_cache_seconds: 600    # кэш проверки подписки (ТЗ п.4.7 — 10 минут)

i18n:
  supported: [ru, en]
  default: en                       # язык, если язык Telegram не поддерживается
  # Языки Telegram, для которых по умолчанию показываем русский
  ru_like: [ru, uk, be, kk, uz, ky, hy, az, ka]

throttle:
  max_events_per_second: 2          # не более N сообщений/нажатий в секунду от одного пользователя

legal:
  privacy_policy_url: "https://barcelona.ru/privacy"  # ЗАПОЛНИТЬ: страница политики конфиденциальности
  # ЗАПОЛНИТЬ: реквизиты оператора персональных данных (юрлицо barcelona.ru)
  controller:
    name: ""          # полное наименование юрлица
    tax_id: ""        # NIF/CIF
    address: ""
    email: ""         # e-mail для запросов по персональным данным

admin:
  language: ru      # язык карточек лидов и отчётов в админ-чате

calc:
  require_subscription: false   # блоки «владение» и «аренда» только подписчикам канала
  municipality: barcelona       # муниципалитет для расчёта (IRNR, зоны регулирования)
  mortgage_share_default: 60    # доля кредита по умолчанию, % от цены
  mortgage_share_options: [50, 60, 70, 80]
  price_min_eur: 10000          # защита от опечаток при вводе цены
  price_max_eur: 100000000

nota_simple:
  # Цена услуги «заказать nota simple через нас» для клиента, €. 0 — бесплатно (цена не показывается).
  price_eur: 25
  # Официальный тариф реестра (registradores.org, онлайн): 9,02 € + IVA ≈ 10,91 €.
  # Источник: Minjusticia, consulta pública RD arancel registral, 21.07.2026 (проверено 2026-11-06).
  official_fee_eur: "9,02 € + IVA"

catastro:
  # Открытые сервисы «datos catastrales no protegidos» (Webservices_Libres.pdf, Catastro).
  base_url: "https://ovc.catastro.meh.es/OVCServWeb/OVCWcfCallejero"
  # Catastro отклоняет запросы без названия клиента — представляемся честно.
  user_agent: "barcelona-bot/1.0 (+https://barcelona.ru)"
  timeout_seconds: 10
  retries: 2                  # повторы после первой неудачной попытки
  # Список всех квартир дома (RC участка из 14 символов, поиск по адресу) Catastro отдаёт
  # медленно: дом на 475 квартир — ~20 с (замерено 2026-11-05). Для таких запросов — дольше.
  list_timeout_seconds: 30
  list_retries: 1
  retry_pause_seconds: 1.5
  cache_days: 7               # кэш ответов по RC
  default_province: "BARCELONA"
  default_municipality: "BARCELONA"
  # Карточка объекта в Sede Electrónica. Проверяется командой selftest (см. DEPLOY.md).
  card_url_template: "https://www1.sedecatastro.gob.es/CYCBienInmueble/OVCConCiud.aspx?UrbRus=U&RefC={rc}&del={province_code}&mun={municipality_code}"
  units_page_size: 8          # сколько квартир показывать на одной странице выбора
